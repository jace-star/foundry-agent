[project]
name = "foundry-agent"
version = "0.1.0"
description = "FastAPI backend for an AI agent service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.143.0",
    "langchain[openai]==1.4.5",
    "langchain-mcp-adapters==0.3.2",
    "langgraph==1.2.15",
    "loguru==0.7.3",
    "opendal==0.47.10",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.6.0",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.22",
    "pwdlib[argon2]>=0.3.0",
    "redis[hiredis]>=8.0,<9",
    "asyncmy>=0.2.14",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
include = ["main.py", "src/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

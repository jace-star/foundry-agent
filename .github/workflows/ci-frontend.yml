name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - web/** # 前端源代码与配置
      - package.json # 根 workspace 配置
      - pnpm-lock.yaml # pnpm 锁定文件
      - pnpm-workspace.yaml # pnpm workspace
      - .github/workflows/ci-frontend.yml # 当前文件

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 只读：检出代码
  pull-requests: read # 只读：读取 PR 标题（WIP 判断）

jobs:
  ci:
    if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') }}
    runs-on: ubuntu-latest
    container: node-runner:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          pnpm install --frozen-lockfile

      - name: ESLint
        shell: bash -l {0}
        run: |
          pnpm --filter foundry-agent lint

      - name: Typecheck
        shell: bash -l {0}
        run: |
          pnpm --filter foundry-agent typecheck

      - name: Build
        shell: bash -l {0}
        run: |
          pnpm build:web
